<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="dotsFin" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.12)"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgFin)"/>
  <rect width="800" height="450" fill="url(#dotsFin)"/>

  <!-- Cartao de credito -->
  <g transform="translate(440,120) rotate(-8)">
    <rect width="280" height="170" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <rect x="20" y="30" width="40" height="30" rx="4" fill="#fbbf24" opacity="0.9"/>
    <rect x="20" y="115" width="180" height="8" rx="4" fill="rgba(255,255,255,0.55)"/>
    <rect x="20" y="135" width="100" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <text x="200" y="48" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#ffffff" opacity="0.9">FIAP</text>
  </g>

  <!-- Grafico de barras -->
  <g transform="translate(80,290)">
    <rect x="0"   y="40" width="30" height="80"  rx="4" fill="#60a5fa" opacity="0.85"/>
    <rect x="40"  y="20" width="30" height="100" rx="4" fill="#93c5fd" opacity="0.85"/>
    <rect x="80"  y="60" width="30" height="60"  rx="4" fill="#60a5fa" opacity="0.85"/>
    <rect x="120" y="0"  width="30" height="120" rx="4" fill="#3b82f6" opacity="0.95"/>
    <rect x="160" y="30" width="30" height="90"  rx="4" fill="#93c5fd" opacity="0.85"/>
  </g>

  <!-- Cifrao -->
  <g transform="translate(280,300)" fill="#fbbf24" opacity="0.9">
    <text font-family="Space Grotesk, sans-serif" font-size="80" font-weight="800">$</text>
  </g>

  <!-- Texto -->
  <text x="60" y="100" font-family="Space Grotesk, sans-serif" font-size="44" font-weight="700" fill="#ffffff">
    Fintech FIAP
  </text>
  <text x="60" y="140" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.85)">
    Sistema Bancario - Java EE + Oracle
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgLet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>
    <radialGradient id="glowLet" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgLet)"/>
  <circle cx="400" cy="225" r="260" fill="url(#glowLet)"/>

  <!-- Ondas sonoras -->
  <g stroke="rgba(255,255,255,0.45)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M120 225 Q160 175 200 225 T280 225 T360 225"/>
    <path d="M440 225 Q480 275 520 225 T600 225 T680 225"/>
  </g>

  <!-- Equalizador (barras) -->
  <g transform="translate(560,140)">
    <rect x="0"   y="40" width="14" height="80"  rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="22"  y="20" width="14" height="120" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="44"  y="60" width="14" height="60"  rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="66"  y="0"  width="14" height="170" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="88"  y="35" width="14" height="100" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="110" y="55" width="14" height="65"  rx="4" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Nota musical -->
  <g transform="translate(120,300)" fill="#ffffff" opacity="0.9">
    <path d="M0 0 L0 -80 L40 -90 L40 -10 Z M-10 5 a16 12 0 1 0 22 0 a16 12 0 1 0 -22 0 M30 -5 a16 12 0 1 0 22 0 a16 12 0 1 0 -22 0"/>
  </g>

  <!-- Texto -->
  <text x="60" y="100" font-family="Space Grotesk, sans-serif" font-size="44" font-weight="700" fill="#ffffff">
    Challenge LetSing
  </text>
  <text x="60" y="140" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.85)">
    FIAP x LetSing - HTML / CSS / JS
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgEsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f7b0f"/>
      <stop offset="100%" stop-color="#1a3a1f"/>
    </linearGradient>
    <linearGradient id="leafEsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <pattern id="gridEsg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgEsg)"/>
  <rect width="800" height="450" fill="url(#gridEsg)"/>

  <!-- Skyline -->
  <g opacity="0.85">
    <rect x="80"  y="240" width="60"  height="180" fill="#22c55e" opacity="0.4"/>
    <rect x="150" y="200" width="70"  height="220" fill="#16a34a" opacity="0.55"/>
    <rect x="230" y="270" width="50"  height="150" fill="#22c55e" opacity="0.35"/>
    <rect x="290" y="170" width="90"  height="250" fill="#15803d" opacity="0.7"/>
    <rect x="390" y="220" width="70"  height="200" fill="#16a34a" opacity="0.55"/>
    <rect x="470" y="180" width="80"  height="240" fill="#22c55e" opacity="0.6"/>
    <rect x="560" y="240" width="60"  height="180" fill="#16a34a" opacity="0.45"/>
    <rect x="630" y="200" width="90"  height="220" fill="#15803d" opacity="0.65"/>
  </g>

  <!-- Folha estilizada (eco) -->
  <g transform="translate(560,80)">
    <path d="M0 80 Q40 0 120 0 Q120 80 60 120 Q20 130 0 80 Z"
          fill="url(#leafEsg)" opacity="0.9"/>
    <path d="M10 90 Q60 50 110 20" stroke="#064e3b" stroke-width="2" fill="none"/>
  </g>

  <!-- Texto -->
  <text x="60" y="100" font-family="Space Grotesk, sans-serif" font-size="42" font-weight="700" fill="#ecfdf5">
    Cidades ESG
  </text>
  <text x="60" y="140" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="500" fill="#86efac">
    Inteligentes - Python / IoT
  </text>
</svg>
